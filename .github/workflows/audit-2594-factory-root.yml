name: Audit Octane attributed root factory

on:
  push:
    branches:
      - audit/2594-attribute-factory-root-20261018
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-2594-factory-root
  cancel-in-progress: true

jobs:
  native-laravel-and-phpstan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: 'dom, curl, libxml, mbstring, zip, fileinfo'
          tools: 'composer:v2'
          coverage: none
      - name: Syntax
        run: |
          php -l tests/Rules/data/OctaneFactoryRootAudit.php
          php -l tests/Rules/OctaneFactoryRootAuditRuleTest.php
          php -l tests/Rules/OctaneFactoryRootAuditRuntimeTest.php
      - name: Install actual Laravel 13
        run: composer update --with='laravel/framework:^13.0' --no-interaction --no-progress
      - name: Real runtime behavior of an attributed root factory
        run: ./vendor/bin/phpunit tests/Rules/OctaneFactoryRootAuditRuntimeTest.php --colors=never
      - name: Verify real PHPStan CLI emits both false positives
        run: |
          set +e
          ./vendor/bin/phpstan analyse -c tests/octane-factory-root-audit.neon --error-format=json --no-progress --memory-limit=3G > /tmp/factory-root-cli.json
          rc=$?
          set -e
          test "$rc" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/factory-root-cli.json').read_text())
          messages = [m['message'] for f in data['files'].values() for m in f['messages']]
          names = set()
          for m in messages:
              if m.startswith('Singleton ScopeFactoryRootAudit') and ' has a constructor dependency' in m:
                  names.add(m.split(' has a constructor dependency', 1)[0].rsplit(chr(92), 1)[-1])
          print('ACTUAL ROOT DIAGNOSTICS', sorted(names))
          assert {'FactoryRoot', 'ClassMappedRoot', 'RealRoot'} <= names, messages
          PY
      - name: "Full PHPStan RuleTestCase suite: should be RED on missed root factory"
        run: composer run-script test:unit
