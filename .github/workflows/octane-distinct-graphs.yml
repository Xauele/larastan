---
name: Octane distinct-graph differential

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seeded-graphs:
    name: "2882 distinct registrations; 1682 positive diagnoses (4x)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "dom, curl, libxml, mbstring, zip, fileinfo"
          tools: "composer:v2"
          coverage: none
      - name: Install exact Laravel 12 range
        run: composer update --with="laravel/framework:^12.0" --no-interaction --no-progress
      - name: Deterministically generate unique code graphs
        run: |
          python3 -m py_compile tests/Rules/scripts/generate_octane_graphs.py tests/Rules/scripts/compare_octane_graphs.py
          OCTANE_GRAPH_SCALE=4 python3 tests/Rules/scripts/generate_octane_graphs.py
          python3 -c 'import json; x=json.load(open("tests/octane-generated-graph-oracle.json")); assert x["total_registrations"] == 2882 and len(x["expected"]) == 1682, x'
          php -l tests/Rules/data/OctaneGeneratedGraphStress.php
          php -l tests/Rules/scripts/octane_wide_runtime.php
      - name: Actual Laravel confirms both permutations retain old request
        run: php tests/Rules/scripts/octane_wide_runtime.php
      - name: Prepare isolated config with optional new rule
        shell: bash
        run: |
          for mode in off on; do
            if [ "$mode" = on ]; then enabled=true; else enabled=false; fi
            cat > "tests/octane-graph-$mode.neon" <<EOF
          includes:
            - phpstan-tests.neon
          parameters:
            level: 0
            paths:
              - Rules/data/OctaneGeneratedGraphStress.php
            checkOctaneCompatibility: $enabled
          EOF
          done
      - name: Exact differential contract + time/memory, cache disabled
        shell: bash
        run: |
          set +e
          set -uo pipefail
          echo "| mode | trial | exit code | seconds | peak kB |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          for trial in 1 2 3; do
            for mode in off on; do
              cat > "tests/octane-graph-$mode-$trial.neon" <<EOF
          includes:
            - octane-graph-$mode.neon
          parameters:
            tmpDir: /tmp/larastan-unique-graphs-$mode-$trial
          EOF
              /usr/bin/time -f '%e %M' -o "$mode-$trial.metrics" ./vendor/bin/phpstan analyse --no-progress --memory-limit=3G --error-format=json -c "tests/octane-graph-$mode-$trial.neon" > "$mode-$trial.json" 2> "$mode-$trial.stderr"
              rc=$?
              read -r seconds rss <<< "$(tail -n 1 "$mode-$trial.metrics")"
              echo "GRAPH_CSV $mode,$trial,$rc,$seconds,$rss"
              echo "| $mode | $trial | $rc | $seconds | $rss |" >> "$GITHUB_STEP_SUMMARY"
              if [ "$mode" = off ] && [ "$rc" -ne 0 ]; then
                cat "$mode-$trial.stderr"
                cat "$mode-$trial.json"
                echo "OFF control failed" >&2
                exit 1
              fi
              if [ "$mode" = on ] && [ "$rc" -ne 1 ]; then
                cat "$mode-$trial.stderr"
                cat "$mode-$trial.json"
                echo "ON should have expected diagnoses" >&2
                exit 1
              fi
              if [ "$mode" = on ]; then
                python3 tests/Rules/scripts/compare_octane_graphs.py "$mode-$trial.json" tests/octane-generated-graph-oracle.json || exit 1
              fi
            done
          done
      - name: Enforce 4x graph overhead contract (paired median and peak RSS)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from statistics import median
          def read_metrics(mode, trial):
              # GNU time prefixes a message for expected PHPStan exit code 1.
              # Only the last line is the configured '%e %M' numeric record.
              fields = Path(f'{mode}-{trial}.metrics').read_text().strip().splitlines()[-1].split()
              assert len(fields) == 2, fields
              return tuple(map(float, fields))
          off = [read_metrics('off', i) for i in range(1, 4)]
          on = [read_metrics('on', i) for i in range(1, 4)]
          base_seconds = median(x[0] for x in off)
          enabled_seconds = median(x[0] for x in on)
          rss_delta_kb = max(x[1] for x in on) - max(x[1] for x in off)
          factor = enabled_seconds / base_seconds
          print(f'4X_GRAPH_RESOURCE_PROOF median_factor={factor:.3f} rss_delta_kb={rss_delta_kb:.0f}')
          assert factor <= 1.5, f'Octane analysis exceeded 1.5x cold-cache median: {factor:.3f}x'
          assert rss_delta_kb <= 102400, f'Octane analysis exceeded +100 MiB peak RSS: {rss_delta_kb:.0f} kB'
          PY
