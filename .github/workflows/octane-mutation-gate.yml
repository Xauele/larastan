---
name: Octane semantic mutation gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kill-known-regressions:
    name: "4 behavioral mutants PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.4"
            laravel: "^12.0"
          - php: "8.5"
            laravel: "^13.0"
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: "dom, curl, libxml, mbstring, zip, fileinfo"
          tools: "composer:v2"
          coverage: none
      - name: Install dependencies
        run: composer update --with="laravel/framework:${{ matrix.laravel }}" --no-interaction --no-progress
      - name: Probe suite must kill 4 semantic mutations (not syntax errors)
        run: |
          python3 -m py_compile tests/Rules/scripts/octane_mutation_gate.py
          python3 tests/Rules/scripts/octane_mutation_gate.py
